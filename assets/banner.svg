<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c241c"/>
      <stop offset="1" stop-color="#141a14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="1" stop-color="#d99a10"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#66bb6a"/>
      <stop offset="1" stop-color="#2e7d32"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#f5b81e22"/>
      <stop offset="1" stop-color="#f5b81e00"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#glow)"/>

  <!-- Upside-down pineapple, centered -->
  <g transform="translate(330,60) scale(0.95)">
    <!-- leaves pointing DOWN (inverted) -->
    <g fill="url(#leaf)">
      <path d="M70 330 C 30 315, 15 285, 28 260 C 50 280, 65 300, 70 330 Z"/>
      <path d="M70 330 C 110 315, 125 285, 112 260 C 90 280, 75 300, 70 330 Z"/>
      <path d="M70 330 C 58 295, 58 270, 70 245 C 82 270, 82 295, 70 330 Z"/>
      <path d="M70 330 C 40 323, 25 303, 20 280 C 48 293, 62 310, 70 330 Z"/>
      <path d="M70 330 C 100 323, 115 303, 120 280 C 92 293, 78 310, 70 330 Z"/>
    </g>
    <!-- fruit on top -->
    <ellipse cx="70" cy="175" rx="62" ry="88" fill="url(#gold)"/>
    <g stroke="#a86f08" stroke-width="3" fill="none" opacity="0.85">
      <path d="M10 155 L130 195"/><path d="M10 195 L130 235"/><path d="M10 115 L130 155"/>
      <path d="M130 155 L10 195"/><path d="M130 195 L10 235"/><path d="M130 115 L10 155"/>
    </g>
    <g fill="#8a5a06">
      <circle cx="70" cy="135" r="5"/><circle cx="70" cy="175" r="5"/><circle cx="70" cy="215" r="5"/>
      <circle cx="40" cy="155" r="5"/><circle cx="100" cy="155" r="5"/>
      <circle cx="40" cy="195" r="5"/><circle cx="100" cy="195" r="5"/>
      <circle cx="70" cy="255" r="5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="490" y="185" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#f5b81e">The Pineapple</text>
  <text x="490" y="235" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#f5b81e">Club</text>
  <text x="490" y="278" font-family="Verdana, sans-serif" font-size="13" letter-spacing="3" fill="#9ab89a">OPEN-MINDED · DISCREET · FUN</text>

  <!-- small inverted pineapples as accents -->
  <g transform="translate(90,40) scale(0.28)" opacity="0.5">
    <ellipse cx="70" cy="175" rx="62" ry="88" fill="url(#gold)"/>
    <g fill="url(#leaf)"><path d="M70 330 C 30 315 15 285 28 260 C 50 280 65 300 70 330 Z"/><path d="M70 330 C 110 315 125 285 112 260 C 90 280 75 300 70 330 Z"/></g>
  </g>
  <g transform="translate(660,260) scale(0.32)" opacity="0.45">
    <ellipse cx="70" cy="175" rx="62" ry="88" fill="url(#gold)"/>
    <g fill="url(#leaf)"><path d="M70 330 C 30 315 15 285 28 260 C 50 280 65 300 70 330 Z"/><path d="M70 330 C 110 315 125 285 112 260 C 90 280 75 300 70 330 Z"/></g>
  </g>
</svg>
