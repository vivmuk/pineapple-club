server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /gate.html {
        try_files $uri =404;
    }

    location = / {
        if ($http_cookie !~* "pcdoor=welcome1") {
            rewrite ^ /gate.html last;
        }
        rewrite ^ /index.html last;
    }

    location / {
        if ($http_cookie !~* "pcdoor=welcome1") {
            return 302 /gate.html;
        }
        try_files $uri $uri/ =404;
    }
}
